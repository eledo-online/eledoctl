[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "eledoctl"
version = "1.2.1"
description = "Command-line toolkit and async Python API client for Eledo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Eledo" }
]
keywords = ["eledo", "cli", "sdk", "pdf", "automation", "api", "documents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "PyYAML>=6.0",
  "types-PyYAML>=6.0",
]

[project.optional-dependencies]
repl = [
  "prompt-toolkit>=3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
eledoctl = "eledoctl.cli.main:main"

[tool.hatch.build]
include = [
  "src/pyeledo/**",
  "src/eledoctl/**",
  "README.md",
  "LICENSE",
]

exclude = [
  ".github/**",
  "tests/**",
  "CONTRIBUTING.md",
  "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyeledo", "src/eledoctl"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--cov=pyeledo --cov=eledoctl --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pyeledo", "eledoctl"]
